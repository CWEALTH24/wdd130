<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Time Surge Rafting - Contact Us</title>
    <meta name="description" content="Contact Fun Time Surge Rafting for trip reservations, rafting information, questions, and feedback. Find our address, phone number, email, and team information.">
    <meta name="author" content="Anierobi Wealth Chioma">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.jpg" alt="Rafting Logo" width="120">
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>  
    <section class="contact-heading">
      <h1>Fun Time Surge Rafting</h1>
      <p>No 9 Ezego Street, Nkpor</p>
      <p>Anambra, Nigeria</p>
      <p>(234) 906-6734-385</p>
      <p>info@funtimesurgerafting.com</p>
    </section>

    <section class="contact-container">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.8842890966657!2d6.829740300000001!3d6.1462401!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10439300106976e9%3A0x1a4cd6919e680358!2sNew%20Tyre%20Nkpor!5e0!3m2!1sen!2sng!4v1780310100433!5m2!1sen!2sng"
                    loading="lazy"
                    allowfullscreen>
                </iframe>
            </div>
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            placeholder="placeholder"
                            type="text"
                            id="name"
                            name="name"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            placeholder="placeholder"
                            type="email"
                            id="email"
                            name="email"
                            required>
                    </div>
                    
                    <div class="purpose-row">
                       <div class="purpose-title">
                           Message 
                    </div>
                    
                    <fieldset>
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>
                    </div>

                    <div class="message section">
                        <label for="message">Message</label>
                        <textarea
                            placeholder="Type Here"
                            id="message"
                            name="message"
                            rows="6"
                            required></textarea>
                    </div>
                    <label class="newsletter" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please Subscribe me to the monthly newsletter
                    </label>
                    <button type="submit">
                        Get in Touch!
                    </button>
                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-cards">
                <figure>
                    <img src="images/employee1.jpg" alt="Operations Manager">
                    <figcaption>Sarah Johnson - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Lead River Guide">
                    <figcaption>Michael Brown - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Customer Service Representative">
                    <figcaption>Emily Davis - Customer Service Representative</figcaption>
                </figure>
            </div>
        </section>
    </main>

  <footer>
    <p> ©2026 Fun Time Surge Rafting | Anierobi Wealth Chioma</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/">
        <img src="images/facebook.png" alt="Facebook Icon" width="30">
      </a>
      <a href="https://www.twitter.com/">
        <img src="images/twitter.png" alt="Twitter Icon" width="30">
      </a>
      <a href="https://www.instagram.com/">
        <img src="images/instagram.png" alt="Instagram Icon" width="30">
      </a>
    </nav>
  </footer>
</body>
</html>
